  .bigprice{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
  .field{display:flex;align-items:center;background:var(--bg);border-radius:14px;padding:4px 16px;margin-top:12px}
  .field input{flex:1;border:none;background:none;font-size:18px;font-weight:700;padding:12px 0;outline:none;min-width:0}
  .field span{font-size:15px;font-weight:700;color:var(--sub)}

  .info{background:var(--bg);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--sub);line-height:1.6}

  .opts{display:grid;gap:10px}
  .opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--line);text-align:left;width:100%}

  .opt .t{font-size:16px;font-weight:700}
  .opt .d{font-size:13px;color:var(--muted);margin-top:2px}
  .opt.on{border-color:var(--blue);background:var(--blue-l)}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:4px}
  .seg button{padding:10px;border-radius:9px;font-size:14px;font-weight:700;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{border-radius:14px;padding:12px 4px;background:var(--bg);text-align:center;border:1.5px solid transparent}

  .tile .n{font-size:13px;font-weight:700;margin-top:4px;color:var(--muted)}
  .tile .a{font-size:12px;color:var(--muted);margin-top:2px}
  .tile.on{background:var(--blue-l);border-color:var(--blue)}

  .tile.on .n{color:var(--text)}
  .tile.on .a{color:var(--blue);font-weight:700}

  .switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0}
  .sw{width:46px;height:28px;border-radius:999px;background:#D1D6DB;position:relative;flex-shrink:0;transition:.2s}
  .sw::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}

  .sw.on::after{left:21px}
  .cta{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;padding:12px 20px 20px;background:linear-gradient(transparent,#fff 30%);z-index:20}

  .btn{width:100%;padding:16px;border-radius:16px;background:var(--blue);color:#fff;font-size:17px;font-weight:700}

  .btn.gray{background:var(--bg);color:var(--text)}

  .sum .tot{border-top:1px solid #D9DDE1;margin-top:8px;padding-top:12px;font-size:17px;font-weight:800;color:var(--text)}

  .pill.no{background:var(--red-l);color:#C8212F}
  .pill.warn{background:var(--red-l);color:#C8212F;font-size:14px;font-weight:500;line-height:1.55}
  .pill small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}

  .grp-h .v{font-size:16px;font-weight:800}

  .grp-b{padding:0 0 14px 20px}

  .it .k small{display:block;font-size:12px;color:var(--muted)}
  .it .r{display:flex;align-items:center;gap:8px;flex-shrink:0}

  .amt.off{color:var(--muted);text-decoration:line-through}

  .cbox .x{position:absolute;top:10px;right:10px;font-size:12px;color:var(--muted);font-weight:700}

  .drow .df{text-align:right;font-weight:800;min-width:72px;font-size:13px}

  .sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 28px;z-index:41}

  .empty{text-align:center;padding:48px 0;color:var(--muted);font-size:15px;line-height:1.6}
  a{color:inherit}
  .mapbox{position:relative;margin:20px -20px 0;height:300px;background:#E9EEF2}
  #map{width:100%;height:100%}
  .mapbox .hint{position:absolute;left:12px;top:12px;z-index:500;background:rgba(255,255,255,.95);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--sub);box-shadow:0 1px 4px rgba(0,0,0,.12);pointer-events:none}
  .pin-wrap{background:none;border:none}
  .pin{position:absolute;left:0;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
  .pin b{background:var(--blue);color:#fff;font-size:13px;font-weight:800;padding:5px 9px;border-radius:10px;white-space:nowrap;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .pin b small{display:block;font-size:10px;font-weight:500;opacity:.9;max-width:90px;overflow:hidden;text-overflow:ellipsis}
  .pin i{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--blue);margin-top:-1px}
  .map-far .pin b{font-size:0;padding:0;width:12px;height:12px;border-radius:50%}

  .map-far .pin i{display:none}

  .budget .echo{color:var(--text);font-weight:700}
  .mapbox .bcount{position:absolute;right:12px;top:12px;z-index:500;background:var(--blue);color:#fff;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 1px 4px rgba(0,0,0,.12);pointer-events:none}

  .pin.out b{background:#B0B8C1;font-size:0;padding:0;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:none}
  .pin.out i{display:none}
  .rc{position:absolute;left:0;top:0;transform:translate(-50%,-50%);background:rgba(49,130,246,.92);color:#fff;border:1.5px solid #fff;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;line-height:1.25;white-space:nowrap;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer}
  .rc b{display:block;font-size:10px;font-weight:500;opacity:.92}
  .listhead{font-size:13px;font-weight:700;color:var(--muted);margin-top:16px}
  .card .meta.ok b{color:var(--blue)}
  .card .meta.no b{color:var(--red)}
  .datasrc{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
</style>

    function formatManwonToKorean(manwon) {
      const val = Math.round(Number(manwon) || 0);
      if (val === 0) return "0원";
      const isNeg = val < 0;
      const abs = Math.abs(val);
      const eok = Math.floor(abs / 10000);
      const rem = abs % 10000;
      let out = "";
      if (eok > 0) {
        out += eok.toLocaleString("ko-KR") + "억";
        if (rem > 0) out += " " + rem.toLocaleString("ko-KR") + "만 원";
        else out += " 원";
      } else {
        out += rem.toLocaleString("ko-KR") + "만 원";
      }
      return isNeg ? "-" + out : out;
    }

    function formatManwonShort(manwon) {
      const val = Math.round((Number(manwon) || 0) * 10) / 10;
      if (val === 0) return "0원";
      return val.toLocaleString("ko-KR") + "만 원";
    }


    function calculateAllCosts(stateSnapshot) {
      const price = Math.max(0, Number(stateSnapshot.purchasePriceManwon) || 0);
      const priceInEok = price / 10000;
      const areaM2 = Number(stateSnapshot.activeAreaM2) || 84;

      // 1) 취득세율 (기획서 5장: 6억 이하 1%, 6~9억 비례식, 9억 초과 3%)
      let acqTaxRate = 0.01;
      let acqRateFormulaText = "6억 이하 1.0%";
      if (price <= 60000) {
        acqTaxRate = 0.01;
        acqRateFormulaText = "6억 원 이하 (1.0%)";
      } else if (price <= 90000) {
        // 취득세율(%) = (매매가(억 원) * 2 / 3) - 3
        const pct = (priceInEok * 2) / 3 - 3;
        acqTaxRate = Math.round(pct * 10000) / 10000 / 100;
        acqRateFormulaText = `6~9억 비례식 (${(acqTaxRate * 100).toFixed(2)}%)`;
      } else {
        acqTaxRate = 0.03;
        acqRateFormulaText = "9억 원 초과 (3.0%)";
      }

      const rawAcqTax = Math.round(price * acqTaxRate * 10) / 10;
      const localEduTaxRate = acqTaxRate * 0.1;
      const localEduTax = Math.round(price * localEduTaxRate * 10) / 10;
      const ruralTaxRate = areaM2 > 85 ? 0.002 : 0;
      const ruralTax = Math.round(price * ruralTaxRate * 10) / 10;
      // 다주택은 중과 여부(조정지역·주택 수)에 따라 8~12%까지 달라져 MVP에서 계산하지 않음 (기획서 8장: 계산 대신 안내)
      const acqTaxExcluded = stateSnapshot.homeOwnership === "multi";
      const totalAcqTaxBeforeDiscount = acqTaxExcluded ? 0 : Math.round((rawAcqTax + localEduTax + ruralTax) * 10) / 10;

      // 생애최초 감면 (최대 200만 원 차감) — 무주택(첫 집)일 때만, 12억 이하
      let firstTimeDiscount = 0;
      const firstTimeEligible = stateSnapshot.homeOwnership === "zero" &&
        price <= CALC_CONFIG_JSON.acquisitionTax.firstTimeBuyerPriceLimitManwon;
      if (!acqTaxExcluded && stateSnapshot.firstTimeBuyer && firstTimeEligible) {
        firstTimeDiscount = Math.min(CALC_CONFIG_JSON.acquisitionTax.firstTimeBuyerMaxDiscountManwon, rawAcqTax);
      }
      const netAcqTax = Math.max(0, Math.round((totalAcqTaxBeforeDiscount - firstTimeDiscount) * 10) / 10);

      // 2) 중개보수 (기획서 5장 상한요율)
      let bracket = CALC_CONFIG_JSON.brokerageFeeBrackets[CALC_CONFIG_JSON.brokerageFeeBrackets.length - 1];
      // maxManwon === null 은 상한 없는 마지막 구간 (JSON 직렬화 시 Infinity → null 문제 방지)
      for (const b of CALC_CONFIG_JSON.brokerageFeeBrackets) {
        if (b.maxManwon === null || price < b.maxManwon) {
          bracket = b;
          break;
        }
      }
      let legalBrokerFee = Math.round(price * bracket.rate * 10) / 10;
      if (bracket.capManwon !== null && legalBrokerFee > bracket.capManwon) {
        legalBrokerFee = bracket.capManwon;
      }
      const finalBrokerFee = stateSnapshot.customBrokerFeeManwon !== null
        ? Math.max(0, Number(stateSnapshot.customBrokerFeeManwon) || 0)
        : legalBrokerFee;
      const brokerVat = stateSnapshot.brokerVatEnabled ? Math.round(finalBrokerFee * 0.1 * 10) / 10 : 0;

      // 3) 등기비 (채권할인비 추정 + 법무사 수수료)
      // 국민주택채권 할인비 단순 추정 (매매가의 약 0.1% 수준) + 법무사 수수료(30~60만 대표값)
      const estBondDiscount = Math.round(price * 0.001);
      const estLawyerFee = stateSnapshot.selfRegEnabled ? 0 : (price <= 60000 ? 35 : price <= 120000 ? 45 : 55);
      const defaultRegFee = estBondDiscount + estLawyerFee;
      const finalRegFee = stateSnapshot.customRegFeeManwon !== null
        ? Math.max(0, Number(stateSnapshot.customRegFeeManwon) || 0)
        : defaultRegFee;

      // 4) 매매계약서 인지세 (매수인 절반 부담)
      let contractStamp = 0;
      let contractStampLabel = "";
      for (const s of CALC_CONFIG_JSON.stampTaxContractHalfManwon) {
        if (s.maxManwon === null || price <= s.maxManwon) {
          contractStamp = s.buyerHalf;
          contractStampLabel = s.label;
          break;
        }
      }

      const group1Total = Math.round((netAcqTax + finalBrokerFee + brokerVat + finalRegFee + contractStamp) * 10) / 10;

      // 그룹 2: 대출 비용
      const loanAmt = stateSnapshot.hasLoan ? Math.max(0, Number(stateSnapshot.loanAmountManwon) || 0) : 0;
      let loanStamp = 0;
      let loanStampLabel = "대출 없음 (0원)";
      if (stateSnapshot.hasLoan && loanAmt > 0) {
        for (const s of CALC_CONFIG_JSON.stampTaxLoanHalfManwon) {
          if (s.maxManwon === null || loanAmt <= s.maxManwon) {
            loanStamp = s.borrowerHalf;
            loanStampLabel = s.label;
            break;
          }
        }
      }
      const appliedLoanStamp = (stateSnapshot.hasLoan && stateSnapshot.loanStampEnabled) ? loanStamp : 0;
      const appliedLoanGuarantee = (stateSnapshot.hasLoan && stateSnapshot.loanGuaranteeEnabled)
        ? Math.max(0, Number(stateSnapshot.loanGuaranteeAmount) || 0)
        : 0;
      const appliedPrepayFee = stateSnapshot.prepayFeeEnabled
        ? Math.max(0, Number(stateSnapshot.prepayFeeAmount) || 0)
        : 0;
      const group2Total = Math.round((appliedLoanStamp + appliedLoanGuarantee + appliedPrepayFee) * 10) / 10;

      // 그룹 3: 입주 비용
      const mgmtDeposit = Math.max(0, Number(stateSnapshot.mgmtDepositAmount) || 0);
      const cleaningFee = Math.max(0, Number(stateSnapshot.cleaningFeeAmount) || 0);
      const movingFee = stateSnapshot.movingFeeEnabled ? Math.max(0, Number(stateSnapshot.movingFeeAmount) || 0) : 0;
      const airconFee = stateSnapshot.airconFeeEnabled ? Math.max(0, Number(stateSnapshot.airconFeeAmount) || 0) : 0;
      const storageMove = stateSnapshot.storageMoveEnabled ? Math.max(0, Number(stateSnapshot.storageMoveAmount) || 0) : 0;
      const furniture = stateSnapshot.furnitureEnabled ? Math.max(0, Number(stateSnapshot.furnitureAmount) || 0) : 0;
      const group3Total = Math.round((mgmtDeposit + cleaningFee + movingFee + airconFee + storageMove + furniture) * 10) / 10;

      // 그룹 4: 수리비 (면적 보정: 선택 면적 ÷ 84, 싱크대·욕실·붙박이장은 개수/자 기준)
      const areaRatio = areaM2 / 84;
      const repairBreakdown = [];
      let calculatedRepairSum = 0;

      for (const [key, cfg] of Object.entries(CALC_CONFIG_JSON.repairBase84m2)) {
        const itemState = stateSnapshot.repairItems[key] || { enabled: false, grade: "standard", customManwon: null };
        const gradeObj = cfg.grades[itemState.grade] || cfg.grades.standard;
        let baseCost = gradeObj.defaultManwon;
        if (cfg.scaleByArea) {
          baseCost = Math.round(baseCost * areaRatio);
        }
        if (key === "bathroom") {
          const bathCount = Number(itemState.count) || 2;
          baseCost = Math.round(gradeObj.defaultManwon * bathCount);
        }
        const finalItemCost = itemState.customManwon !== null
          ? Math.max(0, Number(itemState.customManwon) || 0)
          : baseCost;
        if (itemState.enabled) {
          calculatedRepairSum += finalItemCost;
        }
        repairBreakdown.push({
          key,
          name: cfg.name,
          enabled: itemState.enabled,
          gradeKey: itemState.grade,
          gradeLabel: gradeObj.label,
          rangeText: gradeObj.range,
          scaleByArea: cfg.scaleByArea,
          count: itemState.count || 1,
          amountManwon: itemState.enabled ? finalItemCost : 0,
          defaultComputedManwon: finalItemCost
        });
      }

      const group4Total = stateSnapshot.repairOverrideEnabled
        ? Math.max(0, Number(stateSnapshot.repairOverrideAmount) || 0)
        : Math.round(calculatedRepairSum);

      const extraCostTotal = Math.round((group1Total + group2Total + group3Total + group4Total) * 10) / 10;
      const grandTotal = Math.round((price + extraCostTotal) * 10) / 10;
      const budget = Number(stateSnapshot.budgetManwon) || 0;
      const budgetDiff = budget > 0 ? Math.round((budget - grandTotal) * 10) / 10 : null;

      // 재산세 과세기준일 판별 (잔금 예정일이 6월 1일 이전/당일이면 매수인 부담)
      let buyerPaysPropertyTax = true;
      if (stateSnapshot.closingDate) {
        const parts = stateSnapshot.closingDate.split("-");
        if (parts.length === 3) {
          const month = parseInt(parts[1], 10);
          const day = parseInt(parts[2], 10);
          if (month > 6 || (month === 6 && day > 1)) {
            buyerPaysPropertyTax = false;
          }
        }
      }

      return {
        price,
        areaM2,
        acqTaxRate,
        acqRateFormulaText,
        rawAcqTax,
        localEduTax,
        ruralTax,
        totalAcqTaxBeforeDiscount,
        acqTaxExcluded,
        firstTimeEligible,
        firstTimeDiscount,
        netAcqTax,
        bracketLabel: bracket.label,
        legalBrokerFee,
        finalBrokerFee,
        brokerVat,
        defaultRegFee,
        finalRegFee,
        estBondDiscount,
        estLawyerFee,
        contractStamp,
        contractStampLabel,
        group1Total,
        loanAmt,
        loanStampLabel,
        appliedLoanStamp,
        appliedLoanGuarantee,
        appliedPrepayFee,
        group2Total,
        mgmtDeposit,
        cleaningFee,
        movingFee,
        airconFee,
        storageMove,
        furniture,
        group3Total,
        repairBreakdown,
        calculatedRepairSum,
        group4Total,
        extraCostTotal,
        grandTotal,
        budget,
        budgetDiff,
        buyerPaysPropertyTax
      };
    }

function prepareComplex(d) {
  const age = d.builtYear ? new Date().getFullYear() - d.builtYear + 1 : 10;
  return {
    ...d,
    defaultRepairPreset: d.defaultRepairPreset || (age <= 5 ? "new" : age <= 15 ? "partial" : "full"),
    areas: d.areas.map((a) => ({
      ...a,
      supplyPyeong: a.supplyPyeong || Math.round(a.areaM2 * 0.4),
      monthlyMgmtManwon: a.monthlyMgmtManwon || Math.round(a.areaM2 * 0.28) // 관리비는 실거래에 없어 면적 비례 추정
    }))
  };
}

// 시작할 때는 index.json(시군구 목록·중심·범위)만 받고, 단지는 지도에 보이는 시군구 파일만 그때그때 받음
let REGION_INDEX = [];                 // index.json 의 regions
const regionLoads = new Map();         // 시군구코드 → 받는 중/받은 Promise (같은 파일을 두 번 받지 않음)
const loadedRegions = new Set();       // 받기를 마친 시군구코드
const loadedIds = new Set();           // COMPLEX_DATABASE 에 넣은 단지 id

async function loadData() {
  if (!CONFIG.DATA_BASE) return;
  try {
    const res = await fetch(CONFIG.DATA_BASE + "index.json", { cache: "no-cache" });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    if (!Array.isArray(json.regions) || !json.regions.length) throw new Error("빈 데이터");
    REGION_INDEX = json.regions;
    COMPLEX_DATABASE.length = 0;
    DATA_META = { sample: false, updatedAt: json.updatedAt, period: json.period };
  } catch (e) {
    DATA_META = { sample: true, error: true };
  }
}

function loadRegion(lawdCd) {
  if (regionLoads.has(lawdCd)) return regionLoads.get(lawdCd);
  const p = fetch(`${CONFIG.DATA_BASE}complexes/${encodeURIComponent(lawdCd)}.json`)
    .then((res) => { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then((json) => {
      for (const c of json.complexes || []) {
        if (loadedIds.has(c.id) || !Number.isFinite(c.lat) || !Number.isFinite(c.lng)) continue;
        loadedIds.add(c.id);
        COMPLEX_DATABASE.push(prepareComplex(c));
      }
      loadedRegions.add(lawdCd);
    })
    .catch((e) => {
      regionLoads.delete(lawdCd); // 다음에 지도를 움직이면 다시 시도
      const r = REGION_INDEX.find((x) => x.lawdCd === lawdCd);
      toast(`${r ? r.label : "일부 지역"} 데이터를 못 불러왔어요`);
    });
  regionLoads.set(lawdCd, p);
  return p;
}

function repairItemsFor(presetKey, grade) {

// 단지 연차 → 수리 프리셋 키 (PRESETS)
const presetKeyFor = (d) => (d.defaultRepairPreset === "full" ? "full" : d.defaultRepairPreset === "new" ? "new" : "basic");

// 면적에 따라 달라지는 엔진 입력값 (startDanji·setArea·예산 역검색 공통)
function areaCostDefaults(a) {
  return {
    activeAreaM2: a.areaM2,
    purchasePriceManwon: a.avgPriceManwon,
    mgmtDepositAmount: Math.round(a.monthlyMgmtManwon * 2),
    cleaningFeeAmount: Math.round(a.supplyPyeong * 1.3),
    movingFeeAmount: a.areaM2 <= 60 ? 110 : a.areaM2 <= 85 ? 140 : 180
  };
}

// calculateAllCosts 입력값(E) 만들기. 계산 화면과 예산 역검색이 같은 함수를 써서 숫자가 항상 같음.
// options: persona(PERSONA 키, 기본 S.persona) · preset(PRESETS 키, 기본 단지 연차) · grade(기본 프리셋 자재) · budget(기본 budget)
function buildEngineState(d, a, options = {}) {
  const presetKey = options.preset || presetKeyFor(d);
  const grade = options.grade || PRESETS[presetKey].grade;
  const p = PERSONA[options.persona || S.persona];
  return {
    activeDanjiId: d.id, ...areaCostDefaults(a), budgetManwon: options.budget ?? budget,
    homeOwnership: p.own, firstTimeBuyer: p.ft, closingDate: "",
    hasLoan: false, loanAmountManwon: 0,
    customBrokerFeeManwon: null, brokerVatEnabled: true, selfRegEnabled: false, customRegFeeManwon: null,
    loanStampEnabled: true, loanGuaranteeEnabled: false, loanGuaranteeAmount: 0, prepayFeeEnabled: false, prepayFeeAmount: 0,
    mgmtDepositMonths: 2,
    movingFeeEnabled: true,
    airconFeeEnabled: false, airconCount: 2, airconFeeAmount: 50,
    storageMoveEnabled: false, storageMoveAmount: 150,
    furnitureEnabled: false, furnitureAmount: 500,
    repairOverrideEnabled: false, repairOverrideAmount: 0,
    repairItems: repairItemsFor(presetKey, grade)
  };
}

// options 는 buildEngineState 와 같음. 예산 목록에서 들어오면 BUDGET_OPTIONS 로 같은 가정에서 시작함.
function startDanji(id, areaIdx, options = {}) {
  S.danjiId = id;
  const d = danji();
  S.areaIdx = areaIdx ?? Math.max(0, d.areas.findIndex((a) => a.areaM2 === 84));
  if (options.persona) S.persona = options.persona;
  S.preset = options.preset || presetKeyFor(d);
  S.grade = options.grade || PRESETS[S.preset].grade;
  E = buildEngineState(d, area(), { persona: S.persona, preset: S.preset, grade: S.grade });
  go("price");
}

function setArea(idx) {
  S.areaIdx = idx;
  Object.assign(E, areaCostDefaults(area()));
  render();
}

// ===================== 예산 역검색 =====================
// 가정 고정: 무주택(생애최초 감면 없음) · 대출 없음 · 연차별 기본 프리셋 + 기본 자재 · 입주 비용은 startDanji 기본값
const BUDGET_OPTIONS = { persona: "noFirst", grade: "standard" };
const BUDGET_ASSUMPTION = "무주택 · 대출 없음 · 연차별 기본 수리 기준 예상치예요";
const budgetTotalsCache = new WeakMap(); // 단지 → 면적별 총액. 총액은 예산과 무관해서 단지마다 한 번만 계산

function budgetTotals(d) {
  let t = budgetTotalsCache.get(d);
  if (!t) {
    t = d.areas.map((a, areaIdx) => ({ areaIdx, areaM2: a.areaM2, total: calculateAllCosts(buildEngineState(d, a, BUDGET_OPTIONS)).grandTotal }));
    budgetTotalsCache.set(d, t);
  }
  return t;
}
// 총액이 가장 낮은 면적이 대표. 그 면적이 예산 안이면 "예산 안 면적 중 최저"와 같음.
function budgetMatch(d) {
  const t = budgetTotals(d);
  const best = t.reduce((m, x) => (x.total < m.total ? x : m), t[0]);
  return { d, areaIdx: best.areaIdx, areaM2: best.areaM2, total: best.total, left: budget - best.total, ok: best.total <= budget };
}

// 홈 화면 예산은 천만 원 단위로 입력 (95 → 9억 5,000만 원). budget 변수와 계산은 지금처럼 만 원 단위
const BUDGET_INPUT_UNIT = 1000;                         // 천만 원 = 1,000만 원
const toBudgetManwon = (v) => Math.max(0, Math.round((parseFloat(v) || 0) * BUDGET_INPUT_UNIT));
const budgetInputValue = () => (budget > 0 ? String(+(budget / BUDGET_INPUT_UNIT).toFixed(3)) : "");
const budgetEchoText = (manwon) => (manwon > 0 ? `= ${won(manwon)}` : "");

let budgetTimer;
function onBudgetInput(v) {
  // 입력하는 동안 만 원 환산은 바로 보여주고, 계산은 멈춘 뒤 한 번만
  const echo = document.getElementById("budgetEcho");
  if (echo) echo.textContent = budgetEchoText(toBudgetManwon(v));
  clearTimeout(budgetTimer);
  budgetTimer = setTimeout(() => applyBudget(v), 400);
}
function applyBudget(v) {
  clearTimeout(budgetTimer);
  const next = toBudgetManwon(v);
  if (next === budget) return;
  budget = next;
  // 홈 화면을 다시 그리지 않고 필요한 곳만 바꿈 (입력 포커스·지도 위치 유지)
  const as = document.getElementById("budgetAssume");
  if (as) as.textContent = budget > 0 ? BUDGET_ASSUMPTION : "";
  const echo = document.getElementById("budgetEcho");
  if (echo) echo.textContent = budgetEchoText(budget);
  renderHomeList();
  refreshMap();
}

function go(screen) {
  S.screen = screen;
  S.editing = null;
  render();
  window.scrollTo(0, 0);
}

function back() {
  const order = ["home", "price", "situation", "repair", "result"];
  if (S.screen === "compare") return go(E ? "result" : "home");
  const i = order.indexOf(S.screen);
  go(i > 0 ? order[i - 1] : "home");
}

let toastTimer;
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2400);
}

  app.innerHTML = `

      <div class="ttl">${titles[S.screen] || ""}</div>

        <button class="btn" onclick="go('result')">결과 보기</button>
      </div>
    `;
  },

  result() {
    const c = calculateAllCosts(E);
    const d = danji();
    const groups = buildGroups(c);
    const diff = budget > 0 ? budget - c.grandTotal : null;
    const cash = Math.max(0, c.grandTotal - c.loanAmt);
    return `
      <div class="hero">
        <div class="tag">${esc(d.name)} · ${c.areaM2}㎡ · ${won(c.price)}</div>
        <div class="big">매매가 외에<br><em>${won(c.extraCostTotal)}</em>이 더 필요해요</div>
      </div>
      ${c.acqTaxExcluded ? `<div class="pill warn"><b>취득세가 빠진 금액이에요.</b> 집이 2채 이상이면 취득세가 8~12%까지 올라갈 수 있어 따로 확인해야 해요. <a href="https://www.wetax.go.kr" target="_blank" rel="noopener" style="font-weight:700">위택스 ↗</a></div>` : ""}

      <div class="sum">
        <div class="l"><span>매매가</span><b>${won(c.price)}</b></div>
        <div class="l"><span>추가 비용</span><b style="color:var(--blue)">+${won(c.extraCostTotal)}</b></div>
        <div class="l tot"><span>입주까지 총</span><span>${won(c.grandTotal)}</span></div>
        ${E.hasLoan ? `<div class="l"><span>대출 빼고 내 돈</span><b>${won(cash)}</b></div>` : ""}
      </div>

      <div class="field" style="margin-top:12px"><span style="margin-right:10px">내 예산</span><input type="number" inputmode="numeric" placeholder="입력하면 남는 돈을 알려드려요" value="${budget || ""}" onchange="budget=Math.max(0,+this.value||0);render()" /><span>만 원</span></div>
      ${diff !== null ? (diff >= 0
        ? `<div class="pill ok">입주까지 쓰고 나면 ${won(diff)}이 남아요</div>`
        : `<div class="pill no">예산보다 ${won(-diff)}이 모자라요</div>`) : ""}

      <div class="sec">
        <div class="sec-t">어디에 드는 돈인가요?</div>
        <div class="bar">${groups.map((g) => `<i style="width:${(g.total / Math.max(1, c.extraCostTotal)) * 100}%;background:${GROUP_COLORS[g.id]}"></i>`).join("")}</div>
        ${groups.map((g) => groupBlock(g)).join("")}
      </div>

      <div class="sec">
        <div class="sec-t">잔금은 언제 치르나요?</div>
        <div class="chips">
          <button class="chip sm ${S.closing === "before" ? "on" : ""}" onclick="S.closing='before';render()">6월 1일 이전</button>
          <button class="chip sm ${S.closing === "after" ? "on" : ""}" onclick="S.closing='after';render()">6월 2일 이후</button>
        </div>
        ${S.closing === "before" ? `<div class="info" style="margin-top:10px">그해 재산세는 <b>내가</b> 내요. 7월·9월에 나눠 나와요.</div>` : ""}
        ${S.closing === "after" ? `<div class="info" style="margin-top:10px">그해 재산세는 <b>파는 사람</b>이 내요. 내년부터 내가 내요.</div>` : ""}
      </div>

      <p class="muted" style="margin-top:24px;line-height:1.6">모든 금액은 예상치예요. 1주택 기준 세율(2026년 지방세법)로 계산했고, 정확한 세금은 <a href="https://www.wetax.go.kr" target="_blank" rel="noopener" class="link">위택스</a>에서 확인하세요. 금액에 밑줄이 있으면 눌러서 고칠 수 있어요.</p>

      <div class="cta"><div class="btns">
        <button class="btn gray" onclick="go('home')">다른 집</button>
        <button class="btn" onclick="saveToCompare()">비교함에 담기</button>
      </div></div>
    `;
  },

  compare() {
    const { A, B } = S.slots;
    if (!A || !B) {
      const one = A || B;
      return `
        <h1>두 집을 담으면<br>나란히 비교해드려요</h1>
        <div class="empty">${one ? `<b style="color:var(--text)">${esc(one.name)}</b>을 담았어요.<br>한 곳만 더 담아주세요.` : "아직 담은 집이 없어요."}</div>
        <div class="cta"><button class="btn" onclick="go('home')">집 고르러 가기</button></div>
      `;
    }
    const a = A.calc, b = B.calc;
    const pd = b.price - a.price, td = Math.round(b.grandTotal - a.grandTotal);
    const cheaper = td < 0 ? "B" : td > 0 ? "A" : null;
    let head;
    if (pd > 0 && td < 0) head = `매매가는 B가 ${won(pd)} 비싸지만,<br><em>입주까지는 B가 ${won(-td)} 싸요</em>`;
    else if (pd < 0 && td > 0) head = `매매가는 A가 ${won(-pd)} 비싸지만,<br><em>입주까지는 A가 ${won(td)} 싸요</em>`;
    else if (cheaper) head = `입주까지 <em>${cheaper}가 ${won(Math.abs(td))} 싸요</em>`;
    else head = `입주까지 드는 돈이 같아요`;
    const rows = [["세금·중개", "group1Total"], ["대출", "group2Total"], ["이사·입주", "group3Total"], ["수리", "group4Total"]];
    const box = (k, s, c) => `
      <div class="cbox ${cheaper === k ? "win" : ""}">
        <button class="x" onclick="S.slots.${k}=null;render()">빼기</button>
        <div class="lab">집 ${k}${cheaper === k ? " · 더 싸요" : ""}</div>
        <div class="nm">${esc(s.name)}</div>
        <div class="sub">${c.areaM2}㎡ · ${s.repairLabel}</div>
        <div class="l"><span>매매가</span><b>${won(c.price)}</b></div>
        <div class="l"><span>추가 비용</span><b>+${won(c.extraCostTotal)}</b></div>
        <div class="tt">입주까지<b>${won(c.grandTotal)}</b></div>
      </div>`;
    return `
      <h1 style="font-size:22px">${head}</h1>
      <div class="cmpgrid">${box("A", A, a)}${box("B", B, b)}</div>
      <div class="sec">
        <div class="sec-t">어디서 차이가 나나요?</div>
        <div class="drow muted" style="font-size:12px;padding:6px 0"><span></span><span class="v">A</span><span class="v">B</span><span class="df">B − A</span></div>
        ${rows.map(([lab, key]) => {
          const df = Math.round(b[key] - a[key]);
          return `<div class="drow"><span>${lab}</span><span class="v">${man(a[key])}</span><span class="v">${man(b[key])}</span>
            <span class="df" style="color:${df < 0 ? "var(--blue)" : df > 0 ? "var(--red)" : "var(--muted)"}">${df === 0 ? "같음" : (df > 0 ? "+" : "−") + man(Math.abs(df))}</span></div>`;
        }).join("")}
      </div>
      ${(a.acqTaxExcluded || b.acqTaxExcluded) ? `<div class="pill warn">다주택 조건으로 계산한 집은 취득세가 빠져 있어요.</div>` : ""}
      <div class="cta"><button class="btn gray" onclick="go('home')">다른 집 담기</button></div>
    `;
  }
};

function dataSourceText() {
  if (DATA_META.sample) {
    return `<span class="note" style="margin:0">${DATA_META.error ? "실거래 데이터를 못 불러와 샘플을 보여줘요" : "샘플 데이터 · 실제 시세와 달라요"}</span><span></span>`;
  }
  const d = new Date(DATA_META.updatedAt);
  return `<span>국토교통부 실거래가 · 최근 ${Number(DATA_META.period?.months) || 12}개월</span><span>${d.getMonth() + 1}월 ${d.getDate()}일 갱신</span>`;
}

// ===================== 지도 (Leaflet + V-World) =====================
let mapObj = null;
const repArea = (d) => d.areas.find((a) => a.areaM2 === 84) || d.areas.reduce((m, a) => (a.txCount12m > m.txCount12m ? a : m), d.areas[0]);
const eok = (m) => (m / 10000).toFixed(m >= 100000 ? 1 : 2).replace(/0+$/, "").replace(/\.$/, "") + "억";

function initMap() {
  const el = document.getElementById("map");
  if (!el) return;
  if (typeof L === "undefined") { el.parentElement.innerHTML = `<div class="empty" style="padding:120px 0">지도를 불러오지 못했어요. 아래 목록에서 골라주세요.</div>`; return; }
  if (mapObj) { mapObj.remove(); mapObj = null; }
  mapObj = L.map(el, { zoomControl: false, attributionControl: true });
  if (CONFIG.VWORLD_KEY) {
    L.tileLayer(`https://api.vworld.kr/req/wmts/1.0.0/${CONFIG.VWORLD_KEY}/Base/{z}/{y}/{x}.png`, {
      minZoom: 6, maxZoom: 19, attribution: "© V-World (국토교통부)"
    }).addTo(mapObj);
  } else {
    // 개발용: V-World 키를 넣기 전까지만 사용
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap (개발용)" }).addTo(mapObj);
  }
  pinLayer = L.layerGroup().addTo(mapObj);
  dotRenderer = L.canvas({ padding: 0.3 });
  mapObj.on("moveend", () => {
    S.mapView = { c: mapObj.getCenter(), z: mapObj.getZoom() };
    clearTimeout(moveTimer);
    moveTimer = setTimeout(refreshMap, 300); // 지도가 멈춘 뒤 한 번만
  });
  if (S.mapView) mapObj.setView(S.mapView.c, S.mapView.z);
  else if (DATA_META.sample) {
    const pts = COMPLEX_DATABASE.filter(hasCoords);
    if (pts.length) mapObj.fitBounds(L.latLngBounds(pts.map((d) => [d.lat, d.lng])).pad(0.15));
    else mapObj.setView([37.62, 127.15], 12);
  } else mapObj.fitBounds(seoulBounds());
  refreshMap();
}

let pinLayer = null, dotRenderer = null, moveTimer = null;
let mapMode = "pins";                 // "regions": 시군구 원 · "pins": 단지 핀
let labeledPins = [];                 // 가격표로 보이는 핀 좌표 (겹침 판단용)
const REGION_MODE_MIN = 10;           // 화면에 시군구 중심이 10곳 이상 보이면 시군구 원으로
const DOT_MODE_MIN = 300;             // 화면 안 단지가 300곳을 넘으면 가벼운 점으로
const eok1 = (m) => (m / 10000).toFixed(1).replace(/\.0$/, "") + "억"; // 63200 → 6.3억
const hasCoords = (d) => Number.isFinite(d.lat) && Number.isFinite(d.lng);
const okRegions = () => REGION_INDEX.filter((r) => r.status === "ok" && r.bbox && r.center);
const bboxBounds = (b) => L.latLngBounds([b[0], b[1]], [b[2], b[3]]);

function seoulBounds() {
  const seoul = okRegions().filter((r) => r.sido === "서울특별시");
  if (!seoul.length) return L.latLngBounds([37.413, 126.734], [37.715, 127.269]);
  return seoul.reduce((b, r) => b.extend(bboxBounds(r.bbox)), bboxBounds(seoul[0].bbox));
}

function complexesInView() {
  if (!mapObj) return [];
  if (DATA_META.sample) return COMPLEX_DATABASE.filter(hasCoords);
  const b = mapObj.getBounds().pad(0.05);
  return COMPLEX_DATABASE.filter((d) => hasCoords(d) && b.contains([d.lat, d.lng]));
}

// 지도를 움직인 뒤: 멀면 시군구 원, 가까우면 보이는 시군구 파일을 받아 단지 핀
async function refreshMap() {
  if (!mapObj) return;
  if (DATA_META.sample) { mapMode = "pins"; drawPins(); renderHomeList(); return; }
  const bounds = mapObj.getBounds();
  const regions = okRegions();
  const centersInView = regions.filter((r) => bounds.contains(r.center));
  if (centersInView.length >= REGION_MODE_MIN) {
    mapMode = "regions";
    drawRegionCircles(regions.filter((r) => bounds.intersects(bboxBounds(r.bbox))));
    renderHomeList();
    return;
  }
  mapMode = "pins";
  const touching = regions.filter((r) => bounds.intersects(bboxBounds(r.bbox)));
  const missing = touching.filter((r) => !loadedRegions.has(r.lawdCd));
  drawPins();                          // 이미 받은 것부터 바로 보여줌
  renderHomeList();
  if (missing.length) {
    await Promise.all(missing.map((r) => loadRegion(r.lawdCd)));
    if (mapObj && mapMode === "pins") { drawPins(); renderHomeList(); }
  }
}

function setMapHint(text) {
  const h = document.querySelector(".mapbox .hint");
  if (h) h.textContent = text;
}

// 원 안 이름은 짧게: "서울 강남구" → "강남구", "수원 장안구" → "장안구"
const shortLabel = (r) => r.label.split(" ").at(-1);

function drawRegionCircles(list) {
  pinLayer.clearLayers();
  labeledPins = [];
  mapObj.getContainer().classList.remove("map-far");
  for (const r of list) {
    const icon = L.divIcon({ className: "pin-wrap", iconSize: [0, 0], html: `<div class="rc"><b>${esc(shortLabel(r))}</b>${Number(r.mapped) || 0}곳</div>` });
    L.marker(r.center, { icon, title: r.label }).addTo(pinLayer).on("click", () => mapObj.fitBounds(bboxBounds(r.bbox)));
  }
  setMapHint("원을 누르면 확대해요");
  const badge = document.getElementById("budgetCount");
  if (badge) {
    badge.hidden = !(budget > 0);
    badge.textContent = "확대하면 예산 안 단지를 보여드려요";
    badge.classList.add("zero");
  }
}

// 예산이 없으면 평균가 핀, 있으면 예산 안은 입주 총액 핀 · 초과는 회색 점. 화면 안 단지만 그림
function drawPins() {
  if (!mapObj || !pinLayer) return;
  pinLayer.clearLayers();
  labeledPins = [];
  setMapHint("핀을 누르면 바로 계산해요");
  const list = complexesInView();
  const on = budget > 0;
  const dots = list.length > DOT_MODE_MIN;
  let inCount = 0;
  list.forEach((d) => {
    let r = null;
    if (on) { r = budgetMatch(d); if (r.ok) inCount++; }
    const onClick = r?.ok ? () => startDanji(d.id, r.areaIdx, BUDGET_OPTIONS) : () => startDanji(d.id);
    if (dots) {
      const color = !on || r.ok ? "#3182F6" : "#B0B8C1";
      L.circleMarker([d.lat, d.lng], { renderer: dotRenderer, radius: on && !r.ok ? 3 : 5, color: "#fff", weight: 1, fillColor: color, fillOpacity: 1 })
        .addTo(pinLayer).on("click", onClick);
      return;
    }
    let html, z = 0;
    if (!on) { html = `<div class="pin"><b>${eok(repArea(d).avgPriceManwon)}</b><i></i></div>`; labeledPins.push(d); }
    else if (r.ok) { html = `<div class="pin"><b>${eok1(r.total)}</b><i></i></div>`; labeledPins.push(d); z = 1000; }
    else { html = `<div class="pin out"><b></b></div>`; z = -1000; }
    const icon = L.divIcon({ className: "pin-wrap", iconSize: [0, 0], html });
    L.marker([d.lat, d.lng], { icon, title: d.name, zIndexOffset: z }).addTo(pinLayer).on("click", onClick);
  });
  const badge = document.getElementById("budgetCount");
  if (badge) {
    badge.hidden = !on;
    badge.textContent = `예산 안 ${inCount}곳`;
    badge.classList.toggle("zero", inCount === 0);
  }
  syncZoomClass();
}

// 화면 안 가격표 핀이 40개 이하면 가격표, 많으면 점으로 (겹침 방지)
function syncZoomClass() {
  if (!mapObj) return;
  const bounds = mapObj.getBounds();
  const visible = labeledPins.filter((d) => bounds.contains([d.lat, d.lng])).length;
  mapObj.getContainer().classList.toggle("map-far", visible > 40 && mapObj.getZoom() < 15);
}

// 받침에 맞는 조사: 강남구는 / 남양주시는 / 강원 고성군은
const eunNeun = (w) => { const c = String(w).charCodeAt(String(w).length - 1); return w + (c >= 0xac00 && c <= 0xd7a3 && (c - 0xac00) % 28 ? "은" : "는"); };

// 검색에서 시군구를 고르면 그 시군구로 이동 (파일은 refreshMap 이 받음)
function goRegion(lawdCd) {
  const r = REGION_INDEX.find((x) => x.lawdCd === lawdCd);
  if (!r) return;
  if (!r.bbox || r.status !== "ok") { toast(r.status === "pending" ? `${eunNeun(r.label)} 데이터를 모으는 중이에요` : `${eunNeun(r.label)} 지도에 표시할 단지가 아직 없어요`); return; }
  S.query = "";
  const input = document.querySelector(".search");
  if (input) input.value = "";
  if (mapObj) mapObj.fitBounds(bboxBounds(r.bbox));
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const LIST_MAX = 30;
function homeListHtml() {
  const q = S.query.trim();
  if (DATA_META.sample) {
    return complexListHtml(COMPLEX_DATABASE.filter((d) => !q || (d.name + d.address + d.region).includes(q)), false);
  }
  if (q) {
    const regs = REGION_INDEX.filter((r) => `${r.label} ${r.sido} ${r.sigungu}`.includes(q)).slice(0, 10);
    const cx = COMPLEX_DATABASE.filter((d) => (d.name + d.address + d.region).includes(q));
    if (!regs.length && !cx.length) return `<div class="empty">찾는 동네나 단지가 없어요.<br><span class="muted">단지는 지도에서 불러온 지역 안에서만 찾아요.</span></div>`;
    return (regs.length ? `<div class="listhead">동네</div>` + regs.map(regionCard).join("") : "")
      + (cx.length ? `<div class="listhead">단지</div>` + complexListHtml(cx, true) : "");
  }
  if (mapMode === "regions") return `<div class="empty">지도를 확대하거나 동네를 검색해 보세요.</div>`;
  const inView = complexesInView();
  if (!inView.length) return `<div class="empty">${regionLoads.size > loadedRegions.size ? "단지를 불러오는 중이에요…" : "이 화면에는 단지가 없어요."}</div>`;
  return complexListHtml(inView, true);
}

function regionCard(r) {
  const sub = r.status === "ok" ? `단지 ${Number(r.mapped) || 0}곳` : "데이터를 모으는 중이에요";
  return `
    <button class="card" onclick="goRegion(${jsArg(r.lawdCd)})">
      <div class="row">
        <div><div class="nm">${esc(r.label)}</div><div class="meta">${esc([r.sido, r.sigungu].filter(Boolean).join(" "))}</div></div>
        <div class="pr" style="font-size:14px;font-weight:700;color:var(--sub)">${sub}</div>
      </div>
    </button>`;
}

// 예산이 있으면 예산 목록, 없으면 단지 목록. capped: 최대 LIST_MAX 줄
function complexListHtml(list, capped) {
  const more = (n) => (capped && n > LIST_MAX ? `<div class="muted" style="padding:14px 4px">외 ${n - LIST_MAX}곳 · 지도를 확대하면 좁혀서 보여드려요</div>` : "");
  if (!(budget > 0) || !list.length) {
    const rows = capped ? [...list].sort((a, b) => b.areas.reduce((s, x) => s + x.txCount12m, 0) - a.areas.reduce((s, x) => s + x.txCount12m, 0)) : list;
    return homeList(capped ? rows.slice(0, LIST_MAX) : rows) + more(list.length);
  }
  const rows = list.map(budgetMatch);
  const inside = rows.filter((r) => r.ok).sort((a, b) => a.left - b.left); // 남는 돈 적은 순
  if (inside.length) return `<div class="listhead">예산에 가까운 순이에요</div>` + (capped ? inside.slice(0, LIST_MAX) : inside).map(budgetCard).join("") + more(inside.length);
  const nearest = rows.sort((a, b) => b.left - a.left).slice(0, 3); // 가장 적게 모자란 순
  return `<div class="empty" style="padding:28px 0 4px">예산 안에 드는 단지가 없어요.</div>
    <div class="listhead">조금만 더 있으면 되는 곳</div>` + nearest.map(budgetCard).join("");
}

function budgetCard(r) {
  const gap = Math.round(Math.abs(r.left));
  return `
    <button class="card" onclick="startDanji(${jsArg(r.d.id)}, ${r.areaIdx}, BUDGET_OPTIONS)">
      <div class="nm">${esc(r.d.name)}</div>
      <div class="meta ${r.ok ? "ok" : "no"}">${r.areaM2}㎡ · 입주까지 ${won(r.total)} · <b>${r.ok ? `${won(gap)} 남음` : `${won(gap)} 모자라요`}</b></div>
    </button>`;
}

function homeList(list) {
  if (!list.length) return `<div class="empty">찾는 단지가 없어요.</div>`;
  return list.map((d) => {
    const rep = d.areas.find((a) => a.areaM2 === 84) || d.areas[0];
    return `
      <button class="card" onclick="startDanji(${jsArg(d.id)})">
        <div class="row">
          <div><div class="nm">${esc(d.name)}</div><div class="meta">${esc(d.region)} · ${esc(d.builtYear)}년 · ${d.areas.map((a) => a.areaM2 + "㎡").join(" ")}</div></div>
          <div class="pr">${won(rep.avgPriceManwon)}<small>${rep.areaM2}㎡ 평균</small></div>
        </div>
      </button>`;
  }).join("");
}
function renderHomeList() {
  const el = document.getElementById("homeList");
  if (el) el.innerHTML = homeListHtml();
}

// ===================== 결과 화면: 그룹·항목 =====================
// type: fixed(계산값) | edit(눌러서 수정) | toggle(켜고 끄기 + 수정)
function buildGroups(c) {
  return [
    { id: "g1", name: "세금·중개", total: c.group1Total, items: [
      c.acqTaxExcluded
        ? { k: "취득세", note: "다주택 · 계산 제외", v: 0, type: "fixed" }
        : { k: "취득세", note: `세율 ${(c.acqTaxRate * 100).toFixed(2)}% + 지방교육세${c.ruralTax > 0 ? " + 농특세" : ""}`, v: c.totalAcqTaxBeforeDiscount, type: "fixed" },
      ...(c.firstTimeDiscount > 0 ? [{ k: "생애 첫 집 감면", note: "최대 200만 원", v: -c.firstTimeDiscount, type: "fixed" }] : []),
      { k: "중개보수", note: E.customBrokerFeeManwon !== null ? "협의한 금액" : "법정 상한 · 협의하면 바꾸세요", v: c.finalBrokerFee, type: "edit", key: "broker" },
      { k: "중개보수 부가세", note: "일반과세 사무소면 10%", v: c.brokerVat, type: "toggle", on: E.brokerVatEnabled, tkey: "brokerVatEnabled" },
      { k: "등기비", note: "법무사·채권 · 추정", v: c.finalRegFee, type: "edit", key: "reg" },
      { k: "인지세", note: "계약서 · 매수인 절반", v: c.contractStamp, type: "fixed" }
    ]},
    { id: "g2", name: "대출", total: c.group2Total, items: E.hasLoan
      ? [{ k: "대출 인지세", note: "은행과 절반씩", v: c.appliedLoanStamp, type: "fixed" }]
      : [{ k: "대출 없음", note: "", v: 0, type: "fixed" }] },
    { id: "g3", name: "이사·입주", total: c.group3Total, items: [
      { k: "선수관리비", note: "관리비 예치금 2개월분", v: c.mgmtDeposit, type: "edit", key: "mgmtDepositAmount" },
      { k: "입주청소", note: "면적 비례 추정", v: c.cleaningFee, type: "edit", key: "cleaningFeeAmount" },
      { k: "포장이사", note: "", v: E.movingFeeAmount, type: "toggle", on: E.movingFeeEnabled, tkey: "movingFeeEnabled", key: "movingFeeAmount" },
      { k: "에어컨 이전설치", note: "2대 기준", v: E.airconFeeAmount, type: "toggle", on: E.airconFeeEnabled, tkey: "airconFeeEnabled", key: "airconFeeAmount" },
      { k: "가구·가전", note: "", v: E.furnitureAmount, type: "toggle", on: E.furnitureEnabled, tkey: "furnitureEnabled", key: "furnitureAmount" },
      { k: "보관이사·임시거주", note: "수리 기간에 필요하면", v: E.storageMoveAmount, type: "toggle", on: E.storageMoveEnabled, tkey: "storageMoveEnabled", key: "storageMoveAmount" }
    ]},
    { id: "g4", name: "수리", total: c.group4Total, items: E.repairOverrideEnabled
      ? [{ k: "받은 견적", note: "", v: c.group4Total, type: "fixed" }]
      : c.repairBreakdown.filter((r) => r.enabled).map((r) => ({ k: r.name, note: r.gradeLabel + (r.key === "bathroom" ? ` · ${r.count}개` : ""), v: r.amountManwon, type: "fixed" })),
      footer: `<button class="link" onclick="go('repair')">수리 항목 바꾸기 ›</button>` }
  ];
}

function groupBlock(g) {
  const open = S.open[g.id];
  return `
    <div class="grp">
      <button class="grp-h" onclick="S.open.${g.id}=!S.open.${g.id};render()">
        <span class="dot" style="background:${GROUP_COLORS[g.id]}"></span>
        <span class="n">${g.name}</span><span class="v">${man(g.total)}</span><span class="ar">${open ? "▲" : "▼"}</span>
      </button>
      ${open ? `<div class="grp-b">${g.items.length ? g.items.map(itemRow).join("") : `<div class="it"><span class="k">고칠 곳 없음</span><span>0원</span></div>`}${g.footer || ""}</div>` : ""}
    </div>`;
}

function itemRow(it) {
  const id = it.key || it.tkey;
  let right;
  if (it.type === "fixed") {
    right = `<span class="amt fixed">${it.v < 0 ? "−" + man(-it.v) : man(it.v)}</span>`;
  } else if (S.editing === id && it.key) {
    right = `<input class="mini-in" type="number" data-autofocus value="${it.v}" onchange="commitEdit('${it.key}',this.value)" onblur="commitEdit('${it.key}',this.value)" onkeydown="if(event.key==='Enter')this.blur()" />`;
  } else {
    const off = it.type === "toggle" && !it.on;
    const amount = `<button class="amt ${off ? "off" : ""}" ${it.key ? `onclick="S.editing='${it.key}';render()"` : ""}>${man(it.v)}</button>`;
    right = amount + (it.type === "toggle" ? `<button class="sw s ${it.on ? "on" : ""}" onclick="E.${it.tkey}=!E.${it.tkey};render()" aria-label="${it.k}"></button>` : "");
  }
  return `<div class="it"><span class="k">${it.k}${it.note ? `<small>${it.note}</small>` : ""}</span><span class="r">${right}</span></div>`;
}

function commitEdit(key, val) {
  if (S.editing === null) return;
  const v = Math.max(0, +val || 0);
  if (key === "broker") E.customBrokerFeeManwon = v;
  else if (key === "reg") E.customRegFeeManwon = v;
  else E[key] = v;
  const t = { movingFeeAmount: "movingFeeEnabled", airconFeeAmount: "airconFeeEnabled", furnitureAmount: "furnitureEnabled", storageMoveAmount: "storageMoveEnabled" }[key];
  if (t) E[t] = true;
  S.editing = null;
  render();
}

// ===================== 조작 =====================
function setPersona(k) {
  S.persona = k;
  E.homeOwnership = PERSONA[k].own;
  E.firstTimeBuyer = PERSONA[k].ft;
  render();
}
function setPreset(k) {
  S.preset = k;
  S.grade = PRESETS[k].grade;
  E.repairOverrideEnabled = false;
  E.repairItems = repairItemsFor(k, S.grade);
  render();
}
function toggleRepair(key) {
  E.repairItems[key].enabled = !E.repairItems[key].enabled;
  E.repairItems[key].grade = S.grade;
  S.preset = null;
  render();
}
function setGrade(g) {
  S.grade = g;
  Object.values(E.repairItems).forEach((it) => { it.grade = g; });
  S.preset = null;
  render();
}

function repairLabel() {
  if (E.repairOverrideEnabled) return "받은 견적";
  if (S.preset) return PRESETS[S.preset].t;
  const n = Object.values(E.repairItems).filter((i) => i.enabled).length;
  return n ? `수리 ${n}곳` : "수리 안 함";
}
function snapshot() {
  return { name: danji().name, repairLabel: repairLabel(), calc: calculateAllCosts(E) };
}
function saveToCompare() {
  if (!S.slots.A) { S.slots.A = snapshot(); afterSave("A"); }
  else if (!S.slots.B) { S.slots.B = snapshot(); afterSave("B"); }
  else { S.askSlot = true; render(); }
}
function replaceSlot(k) {
  S.slots[k] = snapshot();
  S.askSlot = false;
  afterSave(k);
}
function afterSave(k) {
  if (S.slots.A && S.slots.B) go("compare");
  else { toast(`집 ${k}로 담았어요. 한 곳 더 고르면 비교해드려요.`); go("home"); }
}
function slotSheet() {
  return `
    <div class="sheet-bg" onclick="S.askSlot=false;render()"></div>
    <div class="sheet">
      <div class="sec-t" style="font-size:18px">어느 집과 바꿀까요?</div>
      <div class="opts" style="margin-top:14px">
        ${["A", "B"].map((k) => `<button class="opt" onclick="replaceSlot('${k}')"><span class="ic">${k}</span><span><div class="t">${esc(S.slots[k].name)}</div><div class="d">입주까지 ${won(S.slots[k].calc.grandTotal)}</div></span></button>`).join("")}
      </div>
    </div>`;
}

document.getElementById("app").innerHTML = `<div class="empty" style="padding-top:200px">불러오는 중…</div>`;
loadData().then(render);
</script>
</body>
