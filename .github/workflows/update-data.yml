name: 실거래 데이터 갱신

# 실거래 원본은 actions/cache 로 보관하고(매일 최근 3개월·매달 1일 전체만 다시 받음),
# 결과(data/)는 저장소에 커밋하지 않고 앱과 함께 GitHub Pages 로 바로 배포해요.
# Settings → Pages → Source 가 "GitHub Actions" 여야 해요.

on:
  schedule:
    - cron: "17 19 * * *"   # 매일 04:17 (한국 시간)
  workflow_dispatch:
    inputs:
      full:
        description: "12개월 전체 다시 받기"
        type: boolean
        default: false
      max_calls:
        description: "이번 실행 API 호출 상한 (비우면 하루 상한 9,000회까지)"
        type: string
        default: ""
  push:                      # 앱·파이프라인을 고치면 다시 배포 (같은 날 받은 달은 다시 안 받아서 호출은 거의 없음)
    branches: [main]
    paths:
      - "app/**"
      - "pipeline/**"
      - ".github/workflows/update-data.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 테스트 (가짜 API)
        run: |
          node pipeline/test/run-mock-test.mjs
          node pipeline/test/run-points-test.mjs

      - name: 원본 캐시 복원
        uses: actions/cache/restore@v6
        with:
          path: pipeline/cache
          key: rtms-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rtms-

      # 단지 좌표는 저장소의 pipeline/apt-points.json 을 씀 (로컬에서 build-points.mjs 로 위치정보요약DB 에서 만듦)

      - name: 실거래 수집·집계
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FULL: ${{ inputs.full && '--full' || '' }}
          MAX_CALLS: ${{ inputs.max_calls }}
        run: |
          if [[ -n "$MAX_CALLS" && ! "$MAX_CALLS" =~ ^[0-9]+$ ]]; then echo "max_calls 는 숫자만 넣어 주세요"; exit 1; fi
          node pipeline/build-data.mjs $FULL ${MAX_CALLS:+--max-calls "$MAX_CALLS"}

      - name: 원본 캐시 저장 (실패해도 저장해서 다음 실행에서 이어 받기)
        if: always() && hashFiles('pipeline/cache/**') != ''
        uses: actions/cache/save@v6
        with:
          path: pipeline/cache
          key: rtms-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 최근 실행 기록
        if: always() && hashFiles('pipeline/cache/runs.jsonl') != ''
        run: tail -n 3 pipeline/cache/runs.jsonl

      - name: 배포 파일 만들기
        env:
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}   # 지도 타일 키. 저장소에는 빈 값, 배포본에만 넣음 (V-World 에서 도메인 제한)
        run: |
          mkdir -p _site
          cp -r app _site/app
          cp -r data _site/data
          node -e '
            const fs = require("fs"), f = "_site/app/index.html", key = process.env.VWORLD_KEY || "";
            if (!key) { console.log("VWORLD_KEY 없음 → 개발용 OSM 지도로 배포"); process.exit(0); }
            if (!/^[A-Za-z0-9-]+$/.test(key)) { console.error("VWORLD_KEY 형식이 이상해요"); process.exit(1); }
            const html = fs.readFileSync(f, "utf8"), from = "VWORLD_KEY: \"\"";
            if (!html.includes(from)) { console.error("app/index.html 에서 VWORLD_KEY 자리를 못 찾았어요"); process.exit(1); }
            fs.writeFileSync(f, html.replace(from, "VWORLD_KEY: \"" + key + "\""));
            console.log("V-World 지도 키 넣음");
          '
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=app/"><title>이 집 얼마 들어?</title><a href="app/">앱으로 이동</a>
          EOF
          echo "시군구 파일 $(ls _site/data/complexes | wc -l)개 · 전체 $(du -sh _site | cut -f1)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
